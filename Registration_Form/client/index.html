<body>
    <div>
        <h1>Registration Form</h1>
            <label>Name</label>
            <input type="text" placeholder="Enter name" class="custom-placeholder" id="Name">
            <small class="name"></small><br>
            <label>Age</label>
            <input type="number" placeholder="Enter your age" class="custom-placeholder" id="Age">
            <small class="age"></small><br>

            <input type="email" placeholder="Enter your email" class="custom-placeholder" id="Email">
            <small class="email"></small><br>
            <label>Password</label>
            <input type="password" placeholder="Enter your password" class="custom-placeholder" id="Password">
            <small class="pass"></small><br>
            <label>Password</label>
            <input type="password" placeholder="Confirm password" class="custom-placeholder" id="Conpassword">
            <small class="conpass"></small><br>
            <label>Mobile Number</label>
            <input type="number" placeholder="Enter your mobile number" class="custom-placeholder" id="Mobile" minlength="10" maxlength="10">
            <small class="mobile"></small><br>
            <button onclick="submited()" id="submit">Submit</button>
    </div>
