<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background-color: rgb(33, 102, 249);
        }
        .game{
            display: flex;
            flex-direction: column;
            background-color: white;
            width: 350px;
            height: 250px;
            border-radius: 20px;
            box-shadow: 2px 2px 10px rgb(255, 255, 255);
        }
        .main-div{
            display: flex;
            justify-content: space-between;
            margin: 30px;
        }
        button{
            width: 100px;
            height: 40px;
            background-color: black;
            color:white;
            align-self: center;
        }
        .scores{
            display: flex;
            flex-direction: row;
            gap: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="game">
        <h1>Rock Paper Scissors</h1>
        <div class="main-div">
            <div class="player1"></div>
            <div class="player2"></div>
        </div>
        <button class="start" onclick="sample()">Play</button>
        <div class="scores">
            <h2 class="Score1"></h2>
            <h2 class="Score2"></h2>
        </div>
    </div>

    <script>
        let score1=document.querySelector(".Score1")
        let score2=document.querySelector(".Score2")
        let player1=document.querySelector(".player1")
        let player2=document.querySelector(".player2")
        let arr=["rock","paper","scissors"]
        let player1score=0,player2score=0,count=0;
        function sample(){
            
            randNumber1=Math.floor(Math.random()*3)
            randNumber2=Math.floor(Math.random()*3)
            player1.textContent=arr[randNumber1]
            player2.textContent=arr[randNumber2]
            if(randNumber1===randNumber2)
                ("Match Draw")
            else if(arr[randNumber1]==="rock")
                player1score++
            else if(arr[randNumber2]==="rock")
                player2score++
            else if(arr[randNumber1]==="paper" && arr[randNumber2]==="scissors")
                player2score++
            else if(arr[randNumber2]==="paper" && arr[randNumber1]==="scissors")
                player1score++

            score1.textContent="player 1: "+ player1score
            score2.textContent="player 2: "+ player2score
            count++
            if(count==5){
                document.querySelector(".start").style.visibility="hidden";
                score1.textContent=""
                score2.textContent=""
                if(player1score==player2score)
                      score1.innerHTML="Match Draw";
                else if(player1score>player2score)
                      score1.innerHTML="player 1 Wins with Score "+player1score
                else
                      score2.innerHTML="player 2 Wins with Score "+player2score
            }
        }
    </script>
</body>
</html>
